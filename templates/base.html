<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {% block name %} Home {% endblock %}</title>
    <link rel="stylesheet" hr ef="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/about">about</a>
        <a href="/contact">contact</a>
        <!-- <a href="/login">login</a> -->
    </nav>

    <main>
        {% block content %}
            
        {% endblock %}
    </main>

    <section>
        <div>
            {% if session.get("username") %}

                <a href="{{ url_for('dashboard' ) }}">
                    dashboard
                </a>

                <a href="{{ url_for('logout' ) }}">
                    logout
                </a>   
            {% else %}
                    
            <a href="{{ url_for('login' ) }}">
                login
            </a>
                
            {% endif %}
        </div>
    </section>

    {% block footer %}{% endblock %}
</body>
</html>
